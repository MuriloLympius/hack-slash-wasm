<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0c13">
<meta name="mobile-web-app-capable" content="yes">
<title>Hack Slash</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0e0c13; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; user-select: none;
           -webkit-user-select: none; -webkit-touch-callout: none; }
  #pb { position: fixed; top: clamp(72px, calc(min(100vw, 100dvh) * 0.2 + 10px), 146px); right: 16px; width: 44px; height: 44px;  /* abaixo do minimapa */
        border-radius: 50%; border: 0; background: #00000066; color: #fff; font: 800 16px system-ui, sans-serif; letter-spacing: 1px; }
  #menu { position: fixed; inset: 0; display: none; flex-direction: column; background: #07050acc; color: #f0ecf8;
          font: 600 16px system-ui, sans-serif; user-select: none; -webkit-user-select: none;
          overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }  /* rola quando não cabe (celular deitado) */
  #menu.on { display: flex; }
  #menu .box { width: min(340px, calc(100vw - 32px)); display: grid; gap: 14px; margin: auto; padding: 16px 0; }  /* margin auto: centra se couber */
  @media (max-height: 520px) and (min-width: 560px) {  /* celular deitado: duas colunas e os dois botões lado a lado no topo */
    #menu .box { width: min(720px, calc(100vw - 32px)); grid-template-columns: 1fr 1fr; gap: 6px 28px; padding: 10px 0; font-size: 14px; }
    #menu h1 { grid-column: 1 / -1; font-size: 22px; margin: 0; order: -3; }
    #mContinuar { order: -2; } #mRecomecar { order: -1; }
    #menu button { min-height: 36px; }
    #menu .row { min-height: 32px; }
    #menu small { display: none; }  /* atalhos de teclado: não servem no celular */
  }
  #menu h1 { margin: 0 0 4px; font: 900 30px Cinzel, Georgia, serif; text-align: center; letter-spacing: 2px; color: #ffd34a; }
  #menu button { min-height: 46px; border: 0; border-radius: 10px; background: #2a2436; color: #f0ecf8; font: inherit; font-weight: 800; }
  #menu button:focus-visible { outline: 2px solid #f0ecf8; }
  #menu .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
  #menu input[type=range] { width: 55%; accent-color: #d0c8e0; }
  #menu input[type=checkbox] { width: 24px; height: 24px; flex-shrink: 0; accent-color: #d0c8e0; }
  #menu small { color: #a59db8; text-align: center; font-weight: 500; }
</style>
</head>
<body>
<canvas id="c" aria-label="Jogo hack and slash"></canvas>
<button id="pb" aria-label="Pausar">II</button>
<div id="menu" role="dialog" aria-modal="true" aria-label="Pausa">
  <div class="box">
    <h1>PAUSA</h1>
    <button id="mContinuar">Continuar</button>
    <label class="row">Volume <input id="mVol" type="range" min="0" max="100" step="5"></label>
    <label class="row">Tremor de tela <input id="mTremor" type="checkbox"></label>
    <label class="row">Vibração <input id="mVibra" type="checkbox"></label>
    <label class="row">Mostrar fps <input id="mFps" type="checkbox"></label>
    <label class="row">Modo fácil: inimigos fracos e lentos <input id="mFacil" type="checkbox"></label>
    <label class="row">Inimigos ferem ao encostar (antigo) <input id="mContato" type="checkbox"></label>
    <label class="row">Godrun: sem dano, 999 moedas, todos os itens (recomeça a run) <input id="mGod" type="checkbox"></label>
    <button id="mRecomecar">Recomeçar run</button>
    <button id="mMetricas">Exportar métricas (JSON)</button>
    <small>Esc ou P pausa e continua · R recarrega</small>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
